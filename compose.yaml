# Local full-stack demonstration: PostgreSQL -> Alembic migrations -> FastAPI -> Next.js.
# Every published port is bound to loopback only. Not a deployment configuration.
name: geevi

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: geevi
      POSTGRES_PASSWORD: ${GEEVI_DB_PASSWORD:-geevi-local-dev}
      POSTGRES_DB: geevi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - geevi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geevi -d geevi"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      GEEVI_DATABASE_URL: postgresql+psycopg://geevi:${GEEVI_DB_PASSWORD:-geevi-local-dev}@db:5432/geevi
      # Explicit development mode: fictional identities and demo seeding are enabled for this local stack.
      GEEVI_DEV_MODE: "true"
      GEEVI_CREDENTIALS_FILE: /data/dev-credentials.json
      GEEVI_ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    depends_on:
      db: { condition: service_healthy }

  seed:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    # Creates the fictional development accounts and one empty demo workspace. No approvals are seeded.
    command: ["python", "scripts/seed_demo.py"]
    environment: *api-env
    volumes:
      - ./.geevi-local:/data
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    environment: *api-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.geevi-local:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args: { GEEVI_API_ORIGIN: "http://api:8000" }
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: { condition: service_healthy }

volumes:
  geevi-db:
