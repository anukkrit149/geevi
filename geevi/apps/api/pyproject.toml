[project]
name = "geevi-api"
version = "0.1.0"
description = "Geevi oncology department journey API (fictional demonstration; not clinically validated)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
fixtures = [
    "pillow>=12.3.0",
    "reportlab>=5.0.1",
]

[tool.uv]
default-groups = ["dev", "fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
